plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties

// Release signing comes from android/key.properties (gitignored, with
// storeFile, storePassword, keyAlias, keyPassword): the upload key. Without
// it a release build stops with what to do (see the check at the end). It
// used to carry on signed with the debug key, which built fine and could
// not be uploaded -- or, sideloaded, could never be updated from Play.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseKey = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseKey = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
            .every { keystoreProperties[it] }
}
def isCi = System.getenv("CI") != null
// For trying a release build on your own phone without the upload key:
//   MOA_DEBUG_SIGNED_RELEASE=1 flutter run --release
// (or moa.debugSignedRelease=true in ~/.gradle/gradle.properties). Never on
// CI, and never for Play.
def debugSignedReleaseAllowed = !isCi && (
        System.getenv("MOA_DEBUG_SIGNED_RELEASE") == "1" ||
        project.findProperty("moa.debugSignedRelease") == "true")

// The shared debug keystore whose SHA-1 is registered for Google Sign-In.
// It is gitignored too; when it is missing, AGP's own ~/.android/debug.keystore
// is used rather than failing the build on a file that is not there.
def sharedDebugKeystore = file("debug-key.keystore")

android {
    // The code's package (MainActivity.kt), not the store identity. It stays
    // app.myotherapp.com because "in" is a hard keyword in Kotlin, so the
    // package can't be app.myotherapp.in. The store identity is applicationId.
    namespace = "app.myotherapp.com"
    // Pinned rather than taken from the Flutter SDK, so an older SDK on the
    // build machine can't quietly build for API 35: Play requires target 36
    // for updates (since 31 Aug 2026).
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // The app's identity on Play and in Firebase (myotherapp-in).
        applicationId = "app.myotherapp.in"
        minSdk = flutter.minSdkVersion
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (sharedDebugKeystore.exists()) {
            debug {
                keyAlias = "debug"
                keyPassword = "myotherapp"
                storeFile = sharedDebugKeystore
                storePassword = "myotherapp"
            }
        }
        if (hasReleaseKey) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // The debug key only when asked for (MOA_DEBUG_SIGNED_RELEASE);
            // otherwise the check below stops the build first.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

// Checked once the build knows what it is building, so a debug build or a
// Gradle sync without key.properties still works and only a release build
// is stopped.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (!buildsRelease || hasReleaseKey) return
    if (debugSignedReleaseAllowed) {
        logger.warn("WARNING: android/key.properties is missing or incomplete; " +
            "MOA_DEBUG_SIGNED_RELEASE is set, so this release build is signed " +
            "with the DEBUG key. It cannot be uploaded to Google Play.")
        return
    }
    throw new GradleException(
        "A release build must be signed with the upload key, and " +
        "android/key.properties is missing or incomplete " +
        "(it needs storeFile, storePassword, keyAlias and keyPassword). " +
        "Build releases from a checkout that has it. To try a release build " +
        "on your own phone without it, run with MOA_DEBUG_SIGNED_RELEASE=1 " +
        "(never for Play, and never on CI).")
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
